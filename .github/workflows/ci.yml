name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend build and tests
        working-directory: web
        run: |
          npm install
          npm run build
          npm test

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # The race detector needs cgo; the Linux runner has gcc preinstalled.
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build agent
        run: go build -trimpath -o bin/ ./cmd/pcsentinel
